<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#f8f9fa"/>

  <!-- T-Shirt Shape -->
  <path d="M200 80 L140 80 L100 120 L100 160 L140 160 L140 320 L260 320 L260 160 L300 160 L300 120 L260 80 L200 80"
        fill="#e9ecef"
        stroke="#dee2e6"
        stroke-width="3"/>

  <!-- Collar -->
  <path d="M170 80 Q200 110 230 80"
        fill="none"
        stroke="#dee2e6"
        stroke-width="3"/>

  <!-- Left Sleeve Line -->
