  <!-- Right Sleeve Line -->
  <line x1="260" y1="80" x2="260" y2="160" stroke="#dee2e6" stroke-width="2"/>

  <!-- Text -->
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="16" fill="#adb5bd" text-anchor="middle">No Image</text>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="14" fill="#ced4da" text-anchor="middle">Available</text>
</svg>
